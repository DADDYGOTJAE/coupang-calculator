<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차별화 전략표 | 대디갓재</title>
<meta name="description" content="쿠팡 무료 라이브 참여자를 위한 상품 차별화 전략표입니다.">
<link rel="stylesheet" href="../../assets/portal.css?v=20260701e">
</head>
<body>
<div class="wrap">
  <div class="sticky-shell">
    <nav class="topbar" id="topbar" data-base="../../"></nav>
    <div class="countdown" id="liveCountdown" data-base="../../"></div>
  </div>
  <a class="back-link" id="backLink" href="../">← 참여 자료실로</a>
  <main id="diffPage"></main>
</div>

<script src="../../assets/topbar.js?v=20260707b"></script>
<script src="../../assets/countdown.js?v=20260707b"></script>
<script src="../../assets/sticky-header.js"></script>
<script>
(async function renderDifferentiationPage(){
  const root = document.getElementById('diffPage');
  const backLink = document.getElementById('backLink');
  if (!root) return;

  const params = new URLSearchParams(window.location.search);
  const queryOpens = params.get('live') === '1' || params.get('open') === '1';
  const remote = queryOpens ? null : await loadRemoteConfig('../../');
  const isRemoteOpen = remote && remote.liveKit && remote.liveKit.open === true;
  const isOpen = queryOpens || isRemoteOpen;
  const chatUrl = (remote && remote.liveKit && remote.liveKit.chatUrl) || 'https://open.kakao.com/o/pAnuH13h';

  if (backLink && isOpen) backLink.setAttribute('href', '../?live=1');

  if (!isOpen) {
    root.innerHTML = `
      <header class="hero">
        <span class="eyebrow">라이브 중 공개</span>
        <h1>차별화 전략표</h1>
        <p>이 자료는 무료 라이브 참여자에게 라이브 중 공개됩니다. 지금은 자료 목록만 확인해주세요.</p>
      </header>

      <div class="notice">
        <b>아직 열람 전입니다.</b><br>
        라이브 중 공개되는 링크로 접속하면 차별화 전략표를 볼 수 있습니다.
      </div>

      <section class="cta-band">
        <h2>차별화는 소싱 직후 바로 확인해야 합니다.</h2>
        <p>상품 후보를 찾은 뒤, 수량·소재·구성·이미지 중 어디를 바꿀 수 있는지 라이브에서 함께 기준을 잡아보세요.</p>
        <a class="btn primary" href="../">참여 자료 목록으로 돌아가기</a>
      </section>

      <section class="chat-band">
        <h2>이제 혼자 고민하지 마세요.</h2>
        <p>1인 셀러가 가장 힘든 순간은 상품을 못 찾을 때가 아닙니다. 이게 맞는 건지 물어볼 곳이 없을 때입니다. 혼자 끙끙대며 시간 보내지 마시고, 대디갓재와 함께 소통하며 성장해 나가세요.</p>
        <a class="btn primary disabled" aria-disabled="true">라이브 참여자 전용 공개</a>
      </section>
    `;
    return;
  }

  const strategies = [
    {
      name: '수량 차별화',
      tag: '묶음·세트',
      desc: '경쟁사와 같은 상품이라도 수량이나 묶음 단위를 바꿔 직접 비교를 어렵게 만듭니다.',
      ex: '1개 판매가 대부분이면 2개 세트, 리필형, 가족용 구성으로 바꿔보기',
      point: '개당 단가가 좋아 보이는지, 묶음 후에도 마진이 남는지 같이 계산하세요.'
    },
    {
      name: '버전 차별화',
      tag: '개선·업그레이드',
      desc: '기존 상품의 불편함을 줄인 개선형, 신형, 보완형 상품을 찾는 방식입니다.',
      ex: '기존형보다 조용한 버전, 접이식 버전, 세척이 쉬운 버전',
      point: '진짜 개선점이 있어야 합니다. 이름만 신형이면 상세페이지에서 설득이 안 됩니다.'
    },
    {
      name: '가격대 차별화',
      tag: '포지션',
      desc: '쿠팡 1페이지 가격대를 보고 비어 있는 구간을 찾습니다. 무조건 싸게 파는 전략이 아닙니다.',
      ex: '저가형과 고가형만 있는 시장에서 중간 가격대 + 구성 강화',
      point: '판매가를 먼저 정하고, 역산 시뮬레이터로 원가 상한선을 확인하세요.'
    },
    {
      name: '기능 차별화',
      tag: '스펙·성능',
      desc: '고객이 불편해하는 지점을 기능으로 해결하는 상품을 찾습니다.',
      ex: '일반형보다 더 강한 고정력, 큰 용량, 빠른 충전, 더 쉬운 조립',
      point: '기능 차이는 썸네일이나 첫 화면에서 바로 보여야 클릭으로 이어집니다.'
    },
    {
      name: '소재 차별화',
      tag: '재질·마감',
      desc: '비슷한 상품이 많을 때 소재와 마감만 달라도 체감 가치가 달라집니다.',
      ex: '플라스틱 중심 시장에서 스테인리스, 무광, 우드톤, 패브릭 마감',
      point: '소재가 좋아져도 원가가 과하게 뛰면 의미가 없습니다. 마진 계산을 먼저 보세요.'
    },
    {
      name: '제조국 차별화',
      tag: '국산·신뢰',
      desc: '중국산이 많은 시장에서는 Made in Korea 자체가 구매 이유가 될 수 있습니다.',
      ex: '메이드인 차이나 중심 시장에서 국내 제조, 국내 생산, 국내 검수 강조',
      point: '국내 제조라고 말하려면 근거가 있어야 합니다. 원산지와 증빙 가능 여부를 먼저 확인하세요.'
    },
    {
      name: '구성품 차별화',
      tag: '추가 구성',
      desc: '고객이 같이 필요로 하는 구성품을 넣어 구매 이유를 강화합니다.',
      ex: '본품 + 리필, 보관 파우치, 거치대, 여분 부품, 사용 설명 카드',
      point: '관련 없는 사은품은 효과가 약합니다. 본품 사용을 더 쉽게 만드는 구성만 남기세요.'
    },
    {
      name: '이미지 차별화',
      tag: '썸네일·장면',
      desc: '제품 사진만 보여주는 대신, 사용 전후나 사용 장면으로 멈춰 보게 만듭니다.',
      ex: '흰 배경 제품컷만 있는 시장에서 사용 장면, 크기 비교, 문제 해결 장면 강조',
      point: '쿠팡 규정 안에서 고객이 얻는 결과가 보이게 만드는 것이 핵심입니다.'
    },
    {
      name: '패키징 차별화',
      tag: '박스·선물감',
      desc: '포장 완성도를 높여 저가 상품처럼 보이지 않게 만드는 전략입니다.',
      ex: '무지 박스 대신 브랜드 박스, 선물용 패키지, 보관이 쉬운 케이스',
      point: '선물성·보관성 상품일수록 패키징이 클릭과 구매 명분을 만들어줍니다.'
    }
  ];

  root.innerHTML = `
    <header class="hero">
      <span class="eyebrow">라이브 후 실습 자료</span>
      <h1>가격 경쟁 전에 <b>차별화 포인트</b>부터 찾기</h1>
      <p>상품 후보를 찾았다면 바로 판매부터 생각하지 말고, 쿠팡 1페이지에서 다르게 가져갈 지점을 먼저 정리하세요.</p>
    </header>

    <div class="notice">
      <b>사용법:</b> 쿠팡 1페이지 경쟁 상품을 보면서 아래 9가지 중 적용 가능한 전략을 체크하세요. 하나만 바꾸면 약하고, 2~3개가 겹치면 가격 비교에서 조금씩 벗어날 수 있습니다.
    </div>

    <section class="diff-guide" aria-label="차별화 전략표">
      <div class="diff-table">
        <div class="diff-head">
          <div>#</div>
          <div>전략</div>
          <div>어떻게 바꿀까?</div>
          <div>확인 포인트</div>
        </div>
        ${strategies.map((item, index) => `
          <div class="diff-row">
            <div class="diff-num"><span>${String(index + 1).padStart(2, '0')}</span></div>
            <div class="diff-name">
              <b>${item.name}</b>
              <em>${item.tag}</em>
            </div>
            <div class="diff-desc">
              <p>${item.desc}</p>
              <small>${item.ex}</small>
            </div>
            <div class="diff-point">
              <strong>체크</strong>
              <p>${item.point}</p>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="diff-combo">
        <h2>추천 조합</h2>
        <ul>
          <li><b>초보 안정형:</b> 수량 차별화 + 이미지 차별화 + 마진 역산</li>
          <li><b>신뢰 강화형:</b> 제조국 차별화 + 패키징 차별화 + 이미지 차별화</li>
          <li><b>가치 상승형:</b> 소재 차별화 + 구성품 차별화 + 패키징 차별화</li>
          <li><b>시장 빈틈형:</b> 가격대 차별화 + 기능 차별화 + 썸네일에서 차이 보여주기</li>
        </ul>
      </div>
    </section>

    <div class="kit-note">
      <b>라이브 활용법:</b> 내가 찾은 상품 후보에 최소 2가지 이상 적용 가능한 차별화가 있는지 적어보세요. 막히는 부분은 그대로 캡처해서 Q&A 때 질문하면 됩니다.
    </div>

    <section class="chat-band">
      <h2>차별화가 안 보이면, 상품을 바꾸는 게 빠를 수 있습니다.</h2>
      <p>1인 셀러가 가장 힘든 순간은 상품을 못 찾을 때가 아닙니다. 이게 맞는 건지 물어볼 곳이 없을 때입니다. 혼자 끙끙대며 시간 보내지 마시고, 대디갓재와 함께 소통하며 성장해 나가세요.</p>
      <a class="btn primary" href="${chatUrl}" target="_blank" rel="noopener">대디갓재 소통방 입장하기</a>
    </section>
  `;

  function loadRemoteConfig(basePath){
    return loadRemoteHelper(basePath)
      .then(helper => helper ? helper.load(basePath) : null)
      .catch(() => null);
  }

  function loadRemoteHelper(basePath){
    if (window.GotjaeRemoteConfig) return Promise.resolve(window.GotjaeRemoteConfig);
    return new Promise(resolve => {
      const script = document.createElement('script');
      script.src = new URL('assets/remote-config.js?t=' + Date.now(), new URL(basePath || './', window.location.href)).toString();
      script.onload = () => resolve(window.GotjaeRemoteConfig || null);
      script.onerror = () => resolve(null);
      document.head.appendChild(script);
    });
  }
})();
</script>
</body>
</html>
